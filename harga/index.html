<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Price List Cat R&amp;D Paint House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: price list toko cat yang rapi, cepat dicari sales di HP
   IDEA: kartu warna cat di etalase, tinggal ketuk lalu kirim penawaran
   PICTURE: daftar warna dengan harga besar per ukuran, keranjang penawaran di samping
   COLOUR and TYPE: navy logo, gradasi semprotan cat; Barlow Condensed + Barlow
   LAYOUT: kiri cari & daftar warna, kanan penawaran sticky; di HP bertumpuk dengan bar bawah */
:root{color-scheme:light dark;--bg:light-dark(#f3f5fa,#0c1124);--card:light-dark(#fff,#151c36);--ink:light-dark(#0d1b3e,#e9ecf5);--mut:light-dark(#566078,#9aa3bd);--line:light-dark(#dde1ec,#283155);--dark:#0d1b3e;--mag:#d61aa6;--grad:linear-gradient(90deg,#14c8f0,#2f7cf0,#8a3cf0,#e21fb0,#ff2f5a,#ff8a1f);--soft:light-dark(#e6f6fd,#12304a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;padding-bottom:84px}
h1,h2,.big{font-family:"Barlow Condensed",Barlow,sans-serif;letter-spacing:.01em}
header{background:#fff;color:#0d1b3e;padding:14px max(4vw,16px) 16px;position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--grad)}
header img{height:clamp(64px,12vw,96px);width:auto;display:block}
header h1{margin:0;font-size:clamp(24px,4.5vw,38px);line-height:1.05;text-align:right}
header h1 small{display:block;color:#566078;font:500 14px Barlow,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:18px max(4vw,16px);display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media(min-width:900px){.wrap{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}.cart{position:sticky;top:16px;align-self:start}body{padding-bottom:0}.bar{display:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px}
h2{font-size:22px;margin:0 0 10px;line-height:1.1}
label.f{display:block;font-size:14px;color:var(--mut);margin-bottom:4px}
input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-height:44px}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--mag);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font:600 16px Barlow,sans-serif;min-height:44px;padding:0 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;cursor:pointer}
.chip.on{background:var(--dark);color:#fff;border-color:var(--dark);box-shadow:inset 0 -4px 0 #14c8f0}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.sw{width:14px;align-self:stretch;border-radius:4px;background:var(--grad);flex:none;opacity:.85}
.nm{flex:1}
.nm b{display:block;font-weight:600}
.nm span{font-size:14px;color:var(--mut)}
.pr{font:700 22px "Barlow Condensed",sans-serif;white-space:nowrap;font-variant-numeric:tabular-nums}
.na{font:500 14px Barlow,sans-serif;color:var(--mut);white-space:nowrap}
.add{font:600 15px Barlow,sans-serif;min-height:44px;min-width:44px;padding:0 12px;border-radius:10px;border:0;background:linear-gradient(90deg,#2f7cf0,#8a3cf0,#e21fb0);color:#fff;cursor:pointer}
.add[disabled]{background:var(--line);color:var(--mut);cursor:default}
.empty{color:var(--mut);padding:12px 0}
.cart{position:relative;overflow:hidden}.cart::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--grad)}
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ci .t{font-weight:600}.ci .s{font-size:14px;color:var(--mut)}
.ci .v{text-align:right;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
.qty b{min-width:24px;text-align:center}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0}
.tot .big{font-size:clamp(34px,6vw,46px);line-height:1;font-variant-numeric:tabular-nums}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;font:600 16px Barlow,sans-serif;text-decoration:none;cursor:pointer;border:0}
.btn.pri{background:linear-gradient(90deg,#2f7cf0,#8a3cf0,#e21fb0);color:#fff}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.full{grid-column:1/-1}
.msg{font-size:14px;color:var(--mag);min-height:20px;margin-top:6px}
#txt{width:100%;min-height:150px;font:14px/1.45 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--ink);display:none;margin-top:8px}
.note{font-size:13px;color:var(--mut);margin-top:10px}
.info{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:15px;margin-top:12px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(4vw,16px);z-index:5}
.bar::before{content:"";position:absolute;left:0;right:0;top:-4px;height:4px;background:var(--grad)}
.bar .big{font-size:28px;line-height:1}
.bar small{color:#b9bcc3;display:block;font-size:13px}
.bar a{color:#fff;background:linear-gradient(90deg,#2f7cf0,#e21fb0);padding:10px 16px;border-radius:10px;text-decoration:none;font-weight:600;white-space:nowrap}
@media(max-width:600px){header h1{text-align:left}}
</style>
</head>

  <h1>Price List Cat<small>Mixing Doyeng Paint · Kupang</small></h1>
</header>

<div class="wrap">
  <main>
    <div class="card">
      <label class="f" for="cari">Cari warna</label>
      <input type="text" id="cari" placeholder="Ketik nama warna, misal: moonlight" autocomplete="off">
      <div class="chips" id="sizes"></div>
      <p class="note" id="upd"></p>
    </div>
    <div class="card">
      <h2 id="lh">Harga</h2>
      <ul class="list" id="list"></ul>
    </div>
  </main>

  <aside class="card cart" id="cart">
    <h2>Penawaran</h2>
    <div class="f"><label class="f" for="nama">Nama customer</label><input type="text" id="nama" placeholder="Contoh: Pak Yohanes"></div>
    <div class="f" style="margin-top:8px"><label class="f" for="nowa">No. WA customer</label><input type="tel" id="nowa" inputmode="tel" placeholder="Contoh: 0812 3456 7890"></div>
    <div id="items" style="margin-top:8px"></div>
    <div class="tot"><span>Total</span><b class="big" id="total">Rp0</b></div>
    <div class="btns">
      <button class="btn pri" type="button" id="copy">Salin teks WA</button>
      <a class="btn sec" id="wa" href="https://wa.me/" target="_blank" rel="noopener">Buka WhatsApp</a>
      <button class="btn sec full" type="button" id="reset">Kosongkan</button>
    </div>
    <div class="msg" id="msg"></div>
    <textarea id="txt" readonly></textarea>
    <div class="info">Harga sudah termasuk ongkir ke Kupang. Rasio campur: cat 100ml + thinner 70ml, aplikasi 2 lapis.</div>
  </aside>
</div>

<div class="bar"><div><small id="bCnt">0 item</small><span class="big" id="bTot">Rp0</span></div><a href="#cart">Lihat penawaran</a></div>

<script>
{
const NAMES=`Fine Silver|1;Coarse Silver|1;Super White|1;Super Black|1;Moonlight Blue|1;Moonlight Red|1;Moonlight Purple|1;Oval Red|1;Magic Blue|1;Dolphine Blue|1;Zombie Black|1;Golden Pink|1;Oval Grey|1;Golden Lilac|1;Pastel Cream;Pastel Blue;Pastel Brown;Silver Lexus;Malachite Green;Lemon Yellow;Red Ferrari;Lime Green Yellow;Orion Titanium Grey;Machine Grey;Titanium Grey;Smoke White;Aquamarine Blue;Azzuro Black;Black Puring;Diamond Black;Magenta Pearl;Alien Green;Nardo Grey;Titanium Sonic;Oval Orange;Oval Purple;Oval Gold;Zombie Flower;Zombie Green;Zombie Red Ferarri;Golden Tosca;Golden Sunkiss;Golden Blue Ice;Galaxy Tosca;Alien Blue;Soul Red Crystal;Zombie Blush Green;Almon Jade;Black Chrome;Silver Chrome;Spesial Effect Gold;Spesial Effect Orange;Verde Silver;Millenium Rose;Millenium Jade;Queen Red;Queen Dark Olive;Moonlight Orange;Monster Light Burgundy;Moonlight Green;Blue Bugatti Solid;Bunglon Love Bird;Bunglon Love Girl;Bunglon Sun Blood;Bunglon Rainbow Spark;Bunglon Goblin;Bunglon Jungle Blue;Bunglon Black to Red;Spesial Effect Blue;Spesial Effect Green;Spesial Effect Pink;Spesial Effect Purple;Bunglon Silver Mint;Sand Khaki HRV;Azurblau;Rose Gold;White Sun;Magic Silver;Bunglon Dragon Purple;Champagne Gold;Anodize Silver;Anodize Gold;Anodize Brown`.split(';').map(s=>{const[n,k]=s.split('|');return{n,kg:!!k}});
let H={},upd='',size='250',cart=[];
const $=id=>document.getElementById(id);
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lbl=s=>s==='1000'?'1kg':s+'ml';
const price=(n,s)=>{const v=H[n]&&H[n][s];return typeof v==='number'&&v>0?v:null};
try{cart=JSON.parse(localStorage.getItem('rdp-pl-cart'))||[]}catch(e){}
const keep=()=>{try{localStorage.setItem('rdp-pl-cart',JSON.stringify(cart))}catch(e){}};

function drawSizes(){$('sizes').innerHTML=['100','250','500','1000'].map(s=>`<button type="button" class="chip${s===size?' on':''}" data-s="${s}">${lbl(s)}</button>`).join('')}
function drawList(){
  const q=$('cari').value.trim().toLowerCase();
  let L=NAMES.filter(c=>c.n.toLowerCase().includes(q)&&(size!=='1000'||c.kg));
  L.sort((a,b)=>(price(b.n,size)?1:0)-(price(a.n,size)?1:0)||a.n.localeCompare(b.n));
  $('lh').textContent='Harga '+lbl(size);
  $('list').innerHTML=L.map(c=>{const p=price(c.n,size);
    return `<li><span class="sw"></span><div class="nm"><b>${esc(c.n)}</b><span>${lbl(size)}</span></div>${p?`<span class="pr">${rp(p)}</span>`:'<span class="na">Tanya admin</span>'}<button type="button" class="add" data-n="${esc(c.n)}"${p?'':' disabled'} aria-label="Tambah ${esc(c.n)}">+</button></li>`}).join('')||'<li class="empty">Warna tidak ditemukan.</li>';
}
function drawCart(){
  let t=0;
  $('items').innerHTML=cart.map((it,i)=>{const p=price(it.n,it.s)||0,v=p*it.q;t+=v;
    return `<div class="ci"><div><div class="t">${esc(it.n)}</div><div class="s">${lbl(it.s)} · ${rp(p)}</div></div><div class="v">${rp(v)}</div><div class="qty"><button type="button" data-m="${i}" aria-label="Kurangi">−</button><b>${it.q}</b><button type="button" data-p="${i}" aria-label="Tambah">+</button></div></div>`}).join('')||'<p class="empty">Ketuk + di daftar warna untuk menambah.</p>';
  $('total').textContent=rp(t);$('bTot').textContent=rp(t);
  $('bCnt').textContent=cart.reduce((a,b)=>a+b.q,0)+' item';
  const tx=teks(t);$('txt').value=tx;
  $('wa').href='https://wa.me/'+waNum()+'?text='+encodeURIComponent(tx);
  $('wa').textContent=waNum()?'Kirim ke customer':'Buka WhatsApp';
  keep();
}
function waNum(){let n=$('nowa').value.replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);else if(n.startsWith('8'))n='62'+n;return n.length>=10?n:''}
function teks(t){
  const nm=$('nama').value.trim(),d=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
  const o=['*PENAWARAN CAT R&D PAINT HOUSE*','Tanggal: '+d];
  if(nm)o.push('Nama: '+nm);
  o.push('','*Rincian*');
  for(const it of cart){const p=price(it.n,it.s)||0;o.push(`• ${it.n} ${lbl(it.s)} x${it.q}: ${rp(p*it.q)}`)}
  o.push('','*Total: '+rp(t)+'*','','Harga sudah termasuk ongkir ke Kupang.','Cat mixing PU Doyeng Paint, rasio campur cat 100ml + thinner 70ml, aplikasi 2 lapis.','','Konsultasi & order:','WA 0811 3810 8055','IG @rdpainthouse');
  return o.join('\n');
}

$('cari').addEventListener('input',drawList);
$('sizes').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;size=b.dataset.s;drawSizes();drawList()});
$('list').addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(!b||b.disabled)return;const n=b.dataset.n,f=cart.find(x=>x.n===n&&x.s===size);if(f)f.q++;else cart.push({n,s:size,q:1});drawCart();$('msg').textContent=n+' '+lbl(size)+' ditambahkan';setTimeout(()=>{$('msg').textContent=''},2000)});
$('items').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const i=+(b.dataset.m??b.dataset.p);if(b.dataset.p!=null)cart[i].q++;else{cart[i].q--;if(cart[i].q<1)cart.splice(i,1)}drawCart()});
for(const id of ['nama','nowa'])$(id).addEventListener('input',drawCart);
$('copy').addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText($('txt').value);$('msg').textContent='Teks sudah disalin, tinggal tempel di WA.';$('txt').style.display='none'}
  catch(err){$('txt').style.display='block';$('txt').focus();$('txt').select();$('msg').textContent='Salin otomatis tidak didukung di sini. Salin manual dari kotak di bawah.'}
});
$('reset').addEventListener('click',()=>{cart=[];$('nama').value='';$('nowa').value='';$('txt').style.display='none';drawCart()});

fetch('harga.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{H=d.harga||{};upd=d.diperbarui||''}).catch(()=>{$('msg').textContent='Data harga gagal dimuat. Coba muat ulang halaman.'}).finally(()=>{
  cart=cart.filter(it=>price(it.n,it.s));
  $('upd').textContent=upd?'Harga diperbarui '+new Date(upd).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})+'. Warna bertanda "Tanya admin" belum ada harganya.':'';
  drawSizes();drawList();drawCart();
});
}
</script>
</body>
</html>
