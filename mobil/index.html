<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16171a">
<title>R&amp;D Paint House – Kalkulator Repaint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: bengkel premium, tegas, ramah untuk karyawan non-teknis
   IDEA: kartu estimasi bengkel — daftar pekerjaan dengan total besar di bawah
   PICTURE: siluet mobil kecil yang menyala emas di panel yang dipilih
   COLOUR and TYPE: charcoal + emas, latar terang; Plus Jakarta Sans
   LAYOUT: satu kolom HP, tombol besar, bar total menempel di bawah */
:root{color-scheme:light dark;
--bg:light-dark(#f3f2ee,#0f1012);--card:light-dark(#ffffff,#1a1b1f);--ink:light-dark(#16171a,#f0eee8);--mute:light-dark(#62646b,#a1a3aa);--line:light-dark(#e1dfd8,#2d2f35);
--char:#16171a;--gold:#e5b437;--gtext:light-dark(#86610f,#f0c862);--gsoft:light-dark(#fcf5e1,#2a2413);
--ok:light-dark(#1d7a48,#62d39c);--warn:light-dark(#9a5800,#f3b35b);--bad:light-dark(#b3261e,#ff8a80);
--glass:light-dark(#d3d9e0,#3b424c);--carbase:light-dark(#c6c4bd,#55575e);--wheel:light-dark(#2a2b2f,#0b0b0c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:20px;font-weight:800}
h3{font-size:16px;font-weight:700}
p{margin:0}
.mute{color:var(--mute)}
.small{font-size:14px}
.tiny{font-size:13px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--char);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 0 10px}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:44px}
.top b{display:block;font-size:17px;line-height:1.2}
.top small{display:block;color:#c9c7c0;font-size:13px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;background:#2a2c31;color:#fff;display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}
.steps{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.steps i{height:4px;border-radius:4px;background:#3a3c42}
.steps i.on{background:var(--gold)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--gsoft);color:var(--gtext);white-space:nowrap}
.badge.grey{background:light-dark(#ecebe6,#2a2c31);color:var(--mute)}
.badge.ok{background:light-dark(#e3f4ea,#163222);color:var(--ok)}
.badge.warn{background:light-dark(#fdf0dc,#33270f);color:var(--warn)}
.badge.bad{background:light-dark(#fbe6e4,#3a1c1a);color:var(--bad)}
/* home */
.hero{background:var(--char);color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 0 26px;border-radius:0 0 28px 28px}
.logo{background:#fff;border-radius:20px;padding:14px 18px;display:block}
.logo img{display:block;width:100%;height:auto}
.hero h1{font-size:clamp(28px,8vw,36px);font-weight:800;margin-top:20px}
.hero p{color:#d6d4cd;margin-top:6px}
.home{display:grid;gap:12px;padding-top:18px;padding-bottom:32px}
.salesbox{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 14px}
.salesbox label{flex:none;font-size:14px;font-weight:700;color:var(--mute);white-space:nowrap}
.salesbox input{border:0;background:transparent;height:44px;font-size:17px;font-weight:600;width:100%;outline:none}
.btn{min-height:52px;border-radius:14px;border:0;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:10px 16px;text-decoration:none;text-align:center;line-height:1.2}
.btn svg{width:22px;height:22px;flex:none}
.btn.xl{min-height:64px;font-size:19px;border-radius:18px}
.gold{background:var(--gold);color:#16171a}
.dark{background:light-dark(#16171a,#2a2c31);color:#fff}
.ghost{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.wa{background:#1fa855;color:#fff}
.btn[disabled],.btn.off{opacity:.45;cursor:not-allowed}
.btn .cnt{background:var(--gold);color:#16171a;border-radius:999px;font-size:14px;padding:1px 9px}
.linkbtn{background:none;border:0;color:var(--mute);font-weight:600;text-decoration:underline;min-height:44px;padding:0 8px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* forms */
main.page{padding-top:16px;padding-bottom:140px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.field{display:grid;gap:6px}
.field>span{font-size:14px;font-weight:700;color:var(--mute)}
.field>span em{font-style:normal;font-weight:500}
.inp{width:100%;height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;font-size:17px;outline:none}
.inp:focus{border-color:var(--gold)}
textarea.inp{height:auto;min-height:110px;padding:12px 14px;line-height:1.45;font-size:15px}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 14px) 22px;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.hint{font-size:13.5px;color:var(--mute);min-height:20px}
.hint.ok{color:var(--ok)}.hint.bad{color:var(--bad)}
.err{color:var(--bad);font-size:14px;font-weight:600}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll .chip{flex:none}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--gold);border-color:var(--gold);color:#16171a}
.chip.sm{min-height:38px;padding:0 12px;font-size:14px}
.chip[disabled]{opacity:.4}
.dot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.2);flex:none}
/* car pick */
.results{display:grid;gap:6px;margin-top:8px}
.res{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);text-align:left;font-size:16px;font-weight:600}
.carpick{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--gsoft);border:1.5px solid var(--gold)}
.carpick div{flex:1}
.carpick b{display:block;font-size:17px}
/* panels */
.sizebar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.plist{display:grid;gap:10px}
.prow{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px}
.prow.on{border-color:var(--gold);background:var(--gsoft)}
.prow .main{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center}
.prow .ic{width:62px;height:34px}
.prow .ic svg{width:100%;height:100%;display:block}
.prow b{display:block;font-size:16px;line-height:1.25}
.prow .pr{font-size:14px;color:var(--mute)}
.prow .sub{font-weight:800;color:var(--gtext);font-size:15px;display:flex;justify-content:space-between;gap:10px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:24px;font-weight:700;line-height:1;display:grid;place-items:center}
.stepper button.plus{background:var(--char);color:#fff;border-color:var(--char)}
:root[data-theme=dark] .stepper button.plus{background:var(--gold);color:#16171a;border-color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .stepper button.plus{background:var(--gold);color:#16171a;border-color:var(--gold)}}
.stepper button[disabled]{opacity:.35}
.stepper output{min-width:28px;text-align:center;font-size:19px;font-weight:800}
.pos{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.other{display:grid;gap:8px;padding:12px;border-radius:14px;border:1.5px solid var(--gold);background:var(--gsoft)}
.other .row{display:grid;grid-template-columns:minmax(0,1fr) 92px 44px;gap:8px;align-items:end}
.xbtn{width:44px;height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:20px}
/* options step 3 */
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px}
.opt.on{border-color:var(--gold);background:var(--gsoft)}
.opt>button.head{all:unset;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:44px}
.opt>button.head:focus-visible{outline:3px solid var(--gold);border-radius:8px}
.box{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;background:var(--card)}
.opt.on .box{background:var(--gold);border-color:var(--gold);color:#16171a}
.box svg{width:18px;height:18px}
.opt b{display:block;font-size:16px}
.opt .d{font-size:14px;color:var(--mute)}
.opt .amt{font-weight:800;color:var(--gtext);font-size:15px;text-align:right}
.calcline{font-size:14px;color:var(--mute);background:light-dark(#f6f5f1,#141518);border-radius:10px;padding:8px 12px}
.upsell{background:var(--char);color:#fff;border-radius:18px;padding:16px;display:grid;gap:12px}
.upsell .chip{background:#24262b;border-color:#3a3c42;color:#fff}
.upsell .chip.on{background:var(--gold);border-color:var(--gold);color:#16171a}
.upsell .note{font-size:13.5px;color:#cfcdc6}
.pkg{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;min-height:52px;padding:8px 14px;border-radius:12px;border:1.5px solid #3a3c42;background:#24262b;color:#fff;text-align:left}
.pkg.on{border-color:var(--gold);background:#2f2a1a}
/* result */
.sum{display:grid;gap:2px}
.sum .who{font-size:20px;font-weight:800}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:last-child{text-align:right;padding-left:12px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tr.sec td{text-align:left!important;padding-left:0!important;padding-top:14px;border-bottom:0;font-size:13px;font-weight:800;color:var(--mute);text-transform:none}
.tbl tr.st td{font-weight:800}
.tbl .sm{display:block;font-size:13px;color:var(--mute);font-weight:500}
.tbl .pend{color:var(--warn);font-weight:700}
.tbl .neg{color:var(--ok)}
.bigtotal{background:var(--char);color:#fff;border-radius:20px;padding:18px 18px 20px}
.bigtotal small{color:#c9c7c0;font-size:14px;font-weight:600;display:block}
.bigtotal .amt{font-size:clamp(34px,11vw,50px);font-weight:800;color:var(--gold);line-height:1.05;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bigtotal .row2{display:flex;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid #33353b;font-size:15px}
.bigtotal .note{font-size:13px;color:#d9b45a;margin-top:10px}
.actions{display:grid;gap:10px}
.actions .grid2 .btn{font-size:15px;min-height:52px}
.warnbox{background:light-dark(#fdf0dc,#2d2410);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600}
.infobox{background:light-dark(#efeee9,#1d1e22);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--mute)}
/* total bar */
.totalbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--char);color:#fff;padding:12px 0 calc(12px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.18)}
.totalbar .wrap{display:flex;align-items:center;gap:12px}
.totalbar .t{flex:1}
.totalbar small{display:block;color:#c9c7c0;font-size:13px}
.totalbar b{display:block;font-size:24px;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.15}
.totalbar .btn{width:auto;min-width:132px}
.totalbar .back{width:auto;min-width:0;background:#2a2c31;color:#fff;padding:10px 14px}
/* history */
.qcard{display:grid;gap:6px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.qcard .r1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.qcard b{font-size:17px}
.qcard .tot{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.qcard .meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:13.5px;color:var(--mute);align-items:center}
.empty{text-align:center;padding:30px 16px;color:var(--mute)}
details.card summary{cursor:pointer;font-weight:700;min-height:28px}
.rev{border-top:1px solid var(--line);padding:10px 0;display:flex;justify-content:space-between;gap:10px;font-size:14px}
/* price list */
.ptbl{width:100%;border-collapse:collapse;font-size:14px}
.ptbl th,.ptbl td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ptbl th:first-child,.ptbl td:first-child{text-align:left;white-space:normal}
.ptbl th{font-size:12.5px;color:var(--mute);font-weight:800}
.mlist{display:flex;flex-wrap:wrap;gap:6px}
.mlist span{font-size:14px;background:light-dark(#efeee9,#25272c);border-radius:8px;padding:4px 10px}
/* admin */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.tabs .chip{flex:none}
.aprow{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.aprow:last-child{border-bottom:0}
.p4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.p4 label{display:grid;gap:2px;font-size:12px;font-weight:700;color:var(--mute)}
.p4 .inp{height:46px;font-size:15px;padding:0 8px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 96px 44px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.mrow .inp{height:44px;font-size:15px}
.mrow .xbtn{height:44px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px}
.sw{position:relative;width:54px;height:32px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.sw span::after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--gold)}
.sw input:checked+span::after{left:25px}
.sw input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
/* car picker v2 */
.searchbox .inp{height:58px;font-size:18px;border-width:2px;border-color:var(--gold)}
.sect{display:grid;gap:8px;margin-top:4px}
.lbl{font-size:13px;font-weight:800;color:var(--mute);margin:0}
.mono{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--char);color:var(--gold);font-weight:800;font-size:12.5px;letter-spacing:.02em;flex:none;vertical-align:middle}
.mono.lg{width:48px;height:48px;font-size:16px;border-radius:14px;background:#2a2c31}
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.brand{display:grid;justify-items:center;gap:4px;padding:12px 6px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:14.5px;text-align:center;min-height:96px}
.brand small{font-size:12px;color:var(--mute);font-weight:500}
.brand:active,.res:active{border-color:var(--gold)}
.res .rb{display:flex;gap:6px;flex:none}
.carcard{background:var(--char);color:#fff;border-radius:20px;padding:16px;display:grid;gap:12px}
.cc-top{display:flex;align-items:center;gap:12px}
.cc-top b{display:block;font-size:22px;line-height:1.15}
.chip.dk{background:#2a2c31;border-color:#3a3c42;color:#fff}
.catbig small{display:block;color:#c9c7c0;font-size:13px;font-weight:600}
.catbig strong{display:block;font-size:clamp(36px,11vw,48px);line-height:1.05;color:var(--gold);font-weight:800;letter-spacing:.01em}
.warns{margin:0;padding:10px 12px 10px 28px;border-radius:12px;background:rgba(229,180,55,.12);color:#f2d27a;font-size:14px;display:grid;gap:4px}
.card .warns,.sheet .warns{background:light-dark(#fdf0dc,#2d2410);color:var(--warn)}
.carstrip{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.carstrip>div{flex:1;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.carstrip b{font-size:16px}
.catpill{font-weight:800;font-size:15px;padding:6px 12px;border-radius:10px;background:var(--char);color:var(--gold);white-space:nowrap}
.catpill.sp{background:light-dark(#fdf0dc,#2d2410);color:var(--warn)}
.bigtotal .amt.sv{font-size:clamp(28px,8vw,38px)}
.statrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.statrow b{display:block;font-size:22px}
.statrow span{font-size:12.5px;color:var(--mute)}
/* modal + toast */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,10,12,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal .sheet{background:var(--card);border-radius:22px;padding:20px;width:100%;max-width:520px;display:grid;gap:14px;margin-bottom:env(safe-area-inset-bottom);max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#16171a;color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;z-index:70;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.car-on{fill:var(--gold)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:600px){main.page{padding-top:24px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script id="core">
/* ===== CORE: data & perhitungan (tanpa DOM) ===== */
var SIZES=[{k:'S',n:'Small'},{k:'M',n:'Medium'},{k:'L',n:'Large'},{k:'XL',n:'Extra Large'},{k:'SP',n:'Special'}];
var PRICED=['S','M','L','XL'];
var STATUSES=['Estimasi Baru','Menunggu Survei','Menunggu Konfirmasi','Harga Disetujui','Penawaran Dikirim','Customer Setuju','Dalam Pengerjaan','Selesai','Batal'];

function unitCount(d){var n=0;for(var k in d.lines)n+=d.lines[k].qty||0;(d.others||[]).forEach(function(o){if(o.name&&toNum(o.price))n+=Math.max(1,toNum(o.qty)||1)});return n}
/* pencarian model: toleran spasi, tanda hubung, salah ketik ringan */
function nk(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){if(a===b)return 0;var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++)d[i]=[i];for(j=0;j<=n;j++)d[0][j]=j;for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function searchModels(models,q){
  var nq=nk(q);if(!nq)return[];
  var toks=String(q).toLowerCase().split(/\s+/).map(nk).filter(Boolean);
  var res=[];
  models.forEach(function(m,i){
    var mk=nk(m.m),bk=nk(m.b),full=bk+mk,sc=0;
    if(mk===nq||full===nq)sc=100;
    else if(mk.indexOf(nq)===0||full.indexOf(nq)===0)sc=80;
    else if(toks.length>1&&toks.every(function(t){return full.indexOf(t)>=0}))sc=70;
    else if(nq.length>=3&&mk.indexOf(nq)>0)sc=50;
    if(sc)res.push({i:i,sc:sc,len:mk.length});
  });
  if(!res.length&&nq.length>=4){
    models.forEach(function(m,i){var mk=nk(m.m);var words=String(m.m).toLowerCase().split(/[\s-]+/).map(nk);
      var best=Math.min(lev(nq,mk.slice(0,nq.length)),Math.min.apply(null,words.map(function(w){return lev(nq,w)})));
      if(best<=(nq.length>=7?2:1))res.push({i:i,sc:20-best,len:mk.length})});
  }
  res.sort(function(a,b){return b.sc-a.sc||a.len-b.len||(models[a.i].b+models[a.i].m).localeCompare(models[b.i].b+models[b.i].m)});
  return res.map(function(r){return r.i});
}
function compute(d,s){
  var survey=!!(d.survey||d.unreg||d.size==='SP');
  var r={size:d.size,sizeName:d.unreg?'Belum terdaftar':sizeName(d.size),survey:survey,lines:[],paintSub:0,unpriced:0,extras:[],extrasSum:0,pending:[],repaintTotal:0,disc:0,discLabel:'',discCapped:false,repaintNet:0,coating:null,grand:0};
  if(!d.size&&!d.unreg)return r;
  s.panels.forEach(function(p){var l=d.lines[p.id];if(!l||!l.qty)return;
    var ov=toNum(l.ov);var base=PRICED.indexOf(d.size)>=0?toNum(p.prices[d.size]):0;var u=ov||base||null;
    var sub=u==null?null:u*l.qty;
    r.lines.push({id:p.id,name:p.name,unitLabel:p.unit,qty:l.qty,unit:u,sub:sub,pos:(l.pos||[]).slice(),ov:!!ov});
    if(sub==null)r.unpriced++;else r.paintSub+=sub});
  (d.others||[]).forEach(function(o){var pr=toNum(o.price);var q=Math.max(1,toNum(o.qty)||1);var nm=(o.name||'').trim();if(!nm||!pr)return;
    r.lines.push({id:'other',name:nm,unitLabel:nm.toLowerCase(),qty:q,unit:pr,sub:pr*q,pos:[],manual:true});r.paintSub+=pr*q});
  if(r.unpriced)r.pending.push('harga panel (menunggu survei)');
  if(d.special.on){var pc=+d.special.pct||0;r.extras.push({key:'special',label:'Warna khusus '+pc+'%',amount:roundK(r.paintSub*pc/100),detail:pc+'% × '+rp(r.paintSub)})}
  if(d.dent.on){var q=Math.max(1,+d.dent.qty||1),nom=toNum(d.dent.nominal);r.extras.push({key:'dent',label:'Penyok/dempul '+q+' panel',amount:nom*q,detail:q+' × '+rp(nom)})}
  if(d.blend.on){var b=toNum(d.blend.amount);r.extras.push(b?{key:'blend',label:'Blending warna',amount:b,detail:'Nominal dari teknisi'}:{key:'blend',label:'Blending warna',amount:null,detail:'Menunggu konfirmasi teknisi'});if(!b)r.pending.push('blending warna')}
  if(d.heavy.on){var h=toNum(d.heavy.amount),nt=(d.heavy.note||'').trim();r.extras.push({key:'heavy',label:'Kerusakan berat'+(nt?' ('+nt+')':''),amount:h||null,detail:h?'Harga setelah survei':'Wajib survei – harga menyusul'});if(!h)r.pending.push('perbaikan kerusakan berat (wajib survei)')}
  r.extras.forEach(function(e){if(e.amount)r.extrasSum+=e.amount});
  r.repaintTotal=r.paintSub+r.extrasSum;
  var max=Math.floor(r.repaintTotal*(+s.discountMax||0)/100);
  if(d.disc.type==='pct'&&+d.disc.pct>0){var p=Math.min(+d.disc.pct,+s.discountMax||0);r.disc=roundK(r.repaintTotal*p/100);r.discLabel='Diskon '+p+'%'}
  else if(d.disc.type==='nom'&&toNum(d.disc.nom)>0){var n=toNum(d.disc.nom);r.disc=Math.min(n,max);r.discCapped=n>max;r.discLabel='Diskon'}
  r.disc=Math.min(r.disc,r.repaintTotal);
  r.repaintNet=r.repaintTotal-r.disc;
  if(d.coating.want===true){var pk=null;(s.coating||[]).forEach(function(c){if(c.id===d.coating.pkg)pk=c});
    var price=pk&&toNum(pk.price)?toNum(pk.price):null;r.coating={name:pk?pk.name:'Ceramic coating',price:price};if(price==null)r.pending.push('ceramic coating')}
  r.grand=r.repaintNet+(r.coating&&r.coating.price?r.coating.price:0);
  return r;
}
function rincianText(c,kind,hide){
  var L=['*Rincian Pekerjaan:*'];
  c.lines.forEach(function(l){
    var amt=hide?'':(l.sub==null?': _harga setelah survei_':': '+rp(l.sub));
    if(l.manual)L.push('• Cat '+l.unitLabel+(l.qty>1?' ('+l.qty+' bh'+(hide?'':' × '+rp(l.unit))+')':'')+amt);
    else{L.push('• Cat '+l.qty+' '+l.unitLabel+amt);if(l.pos.length)L.push('   _'+l.pos.join(', ').toLowerCase()+'_')}
  });
  if(hide){
    if(c.extras.length){L.push('');L.push('*Pekerjaan tambahan:*');c.extras.forEach(function(e){L.push('• '+e.label.replace(/ \d+%$/,''))})}
    if(c.coating){L.push('');L.push('*Ceramic Coating:* '+c.coating.name)}
    L.push('');L.push('*TOTAL: menunggu hasil survei*');
    L.push('_Kendaraan ini memerlukan survei/pemeriksaan langsung oleh teknisi kami. Harga akan kami informasikan setelah pemeriksaan._');
    return L.join('\n');
  }
  var hasMore=c.extras.length||c.disc;
  if(hasMore){L.push('');L.push('Subtotal pengecatan: '+rp(c.paintSub))}
  if(c.extras.length){L.push('');L.push('*Biaya Tambahan:*');c.extras.forEach(function(e){L.push('• '+e.label+': '+(e.amount?rp(e.amount):'_'+e.detail.toLowerCase()+'_'))})}
  if(c.disc){L.push('');L.push(c.discLabel+': -'+rp(c.disc))}
  L.push('');L.push('*'+(kind==='fin'?'TOTAL HARGA':'TOTAL ESTIMASI')+': '+rp(c.repaintNet)+'*');
  if(c.coating){L.push('');L.push('*Ceramic Coating:*');L.push('• '+c.coating.name+': '+(c.coating.price?rp(c.coating.price):'_harga menyusul_'));
    if(c.coating.price){L.push('');L.push('*TOTAL REPAINT + COATING: '+rp(c.grand)+'*')}
    L.push('_Jadwal ceramic coating setelah repaint menunggu konfirmasi teknisi (curing cat dan clear coat)._')}
  if(c.pending.length){L.push('');L.push('_Belum termasuk: '+c.pending.join(', ')+'. Harga menyusul setelah dicek teknisi._')}
  return L.join('\n');
}

function saveDraftRec(status){
  const t=Date.now();const calc=compute(D,S);if(!status&&calc.survey)status='Menunggu Survei';
  let rec=D.id&&Q.find(q=>q.id===D.id);
  if(!rec){rec=createRec(D,salesName,status||'Estimasi Baru',false,t);Q.unshift(rec);D.id=rec.id;rec.draft.id=rec.id;saveQ();saveD();ui.dirty=false;return{rec,isNew:true}}
  const nd=clone(D);
  if(JSON.stringify(rec.draft)!==JSON.stringify(nd)){
    rec.revisions.push({rev:rec.rev,at:rec.updatedAt,sales:rec.sales,draft:rec.draft,calc:rec.calc,status:rec.status,approved:rec.approved});
    rec.rev++;rec.draft=nd;rec.calc=calc;rec.updatedAt=t;rec.sales=salesName||rec.sales;
    if(rec.approved){rec.approved=null}
    const ns=status||'Estimasi Baru';rec.status=ns;rec.log.push({at:t,s:ns+' (revisi ke-'+rec.rev+')',by:salesName});
  }else if(status&&rec.status!==status){rec.status=status;rec.updatedAt=t;rec.log.push({at:t,s:status,by:salesName})}
  saveQ();ui.dirty=false;return{rec,isNew:false};
}
function setStatus(rec,s,by){rec.status=s;rec.updatedAt=Date.now();rec.log.push({at:rec.updatedAt,s:s,by:by||salesName});saveQ()}

function catNorm(v){const s=String(v==null?'':v).trim().toLowerCase().replace(/\s+/g,' ');return {s:'S',small:'S',m:'M',medium:'M',l:'L',large:'L',xl:'XL','extra large':'XL',special:'SP',sp:'SP',survei:'SP'}[s]||null}
function yes(v){return /^(ya|y|yes|true|1)$/i.test(String(v==null?'':v).trim())}
function rowsToModels(rows){
  if(!rows.length)return{ok:[],bad:[]};
  let head=null,start=0;
  for(let r=0;r<Math.min(rows.length,10);r++){const h=rows[r].map(x=>nk(x));if(h.indexOf('merek')>=0||h.indexOf('brand')>=0){head=h;start=r+1;break}}
  if(!head)return{ok:[],bad:[{row:0,why:'Kolom Merek/Model tidak ditemukan'}]};
  const ix=n=>{for(const k of n){const i=head.indexOf(k);if(i>=0)return i}return -1};
  const iB=ix(['merek','brand']),iM=ix(['model']),iC=ix(['kategori','category','ukuran']),iS=ix(['wajibsurvei','survei','survey']),iN=ix(['catatan','note','notes']),iSt=ix(['status']);
  const ok=[],bad=[];
  for(let r=start;r<rows.length;r++){const x=rows[r];if(!x||!x.some(v=>String(v==null?'':v).trim()))continue;
    const b=String(x[iB]==null?'':x[iB]).trim(),m=String(x[iM]==null?'':x[iM]).trim(),c=catNorm(x[iC]);
    if(!b||!m||!c){bad.push({row:r+1,why:(b+' '+m).trim()||'(kosong)'});continue}
    let n=iN>=0?String(x[iN]==null?'':x[iN]).trim():'';if(n==='Konfirmasi generasi/model jika ada perubahan dimensi')n='';
    const st=iSt>=0&&/verif/i.test(String(x[iSt]||''))&&!/perlu/i.test(String(x[iSt]||''))?'V':(iSt>=0&&/wajib/i.test(String(x[iSt]||''))?'K':'E');
    ok.push({b,m,s:c,sv:iS>=0?yes(x[iS]):c==='SP',n,st});
  }
  return{ok,bad};
}
function parseCsv(t){const sep=(t.split('\n')[0].match(/;/g)||[]).length>=(t.split('\n')[0].match(/,/g)||[]).length?';':',';const out=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else if(ch==='"')q=true;else if(ch===sep){row.push(f);f=''}else if(ch==='\n'){row.push(f.replace(/\r$/,''));out.push(row);row=[];f=''}else f+=ch}
  if(f||row.length){row.push(f);out.push(row)}return out}
function loadXlsx(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>res(window.XLSX);s.onerror=()=>rej(new Error('Pembaca Excel gagal dimuat. Simpan file sebagai CSV lalu import lagi.'));document.head.appendChild(s)})}
async function importFile(file){
  try{
    let rows=[];const name=file.name.toLowerCase();
    if(/\.json$/.test(name)){let o=JSON.parse(await file.text());if(o&&o.models)o=o.models;if(!Array.isArray(o))throw new Error('Format JSON tidak dikenali');
      rows=[['merek','model','kategori','wajib survei','catatan','status']].concat(o.map(x=>Array.isArray(x)?[x[0],x[1],x[2]==='SP'?'Special':x[2],x[3]?'Ya':'Tidak',x[4],x[5]==='V'?'Terverifikasi':(x[5]==='K'?'WAJIB':'')]:[x.Merek||x.merek||x.b||x.brand,x.Model||x.model||x.m,(x.Kategori||x.kategori||x.s||x.category)==='SP'?'Special':(x.Kategori||x.kategori||x.s||x.category),(x['Wajib Survei']!=null?x['Wajib Survei']:(x.sv?'Ya':'Tidak')),x.Catatan||x.catatan||x.n||'',x.Status||x.status||(x.st==='V'?'Terverifikasi':'')]))}
    else if(/\.csv$/.test(name))rows=parseCsv((await file.text()).replace(/^﻿/,''));
    else{const X=await loadXlsx();const wb=X.read(await file.arrayBuffer(),{type:'array'});let best=null;
      for(const sn of wb.SheetNames){const r=X.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});if(r.slice(0,10).some(x=>x.map(nk).indexOf('merek')>=0)){best=r;if(/database/i.test(sn))break}}
      rows=best||[]}
    const {ok,bad}=rowsToModels(rows);
    if(!ok.length){toast('Tidak ada baris valid. Pastikan ada kolom Merek, Model, Kategori');return}
    const seen={};const uniq=[];let dup=0;ok.forEach(m=>{const k=nk(m.b)+'|'+nk(m.m);if(seen[k]){dup++;return}seen[k]=1;uniq.push(m)});
    const cur={};S.models.forEach((m,i)=>cur[nk(m.b)+'|'+nk(m.m)]=i);
    let add=0,chg=0,same=0;uniq.forEach(m=>{const i=cur[nk(m.b)+'|'+nk(m.m)];if(i==null)add++;else{const o=S.models[i];if(o.s!==m.s||!!o.sv!==!!m.sv)chg++;else same++}});
    modal({title:'Ringkasan import',html:'<p>'+uniq.length+' model valid dari '+esc(file.name)+'</p><ul class="warns" style="color:var(--ink)"><li>'+add+' model baru</li><li>'+chg+' model berubah kategori/survei</li><li>'+same+' sama persis</li>'+(dup?'<li>'+dup+' duplikat di file dilewati</li>':'')+(bad.length?'<li>'+bad.length+' baris tidak valid dilewati (contoh: '+esc(bad.slice(0,3).map(b=>'baris '+b.row+' '+b.why).join('; '))+')</li>':'')+'</ul><label class="toggle"><span class="small" style="font-weight:700">Ganti seluruh database (bukan gabung)</span><span class="sw"><input type="checkbox" id="impReplace"><span></span></span></label>',ok:'Terapkan import',
      onOk:m=>{const rep=m.querySelector('#impReplace').checked;const t=Date.now();
        if(rep){S.models=uniq}else{uniq.forEach(x=>{const i=cur[nk(x.b)+'|'+nk(x.m)];if(i==null)S.models.push(x);else S.models[i]=Object.assign({},S.models[i],x)})}
        logChange('Import database mobil ('+file.name+')',S.models.length+' model',rep?'ganti semua':'gabung: +'+add+', ubah '+chg);saveS();render();toast('Import selesai')}});
  }catch(err){toast(err.message||'File tidak bisa dibaca')}
}
function dbCsv(){const q=v=>{v=String(v==null?'':v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return '﻿'+['Merek','Model','Kategori','Wajib Survei','Status','Catatan'].join(';')+'\n'+S.models.slice().sort((a,b)=>(a.b+a.m).localeCompare(b.b+b.m)).map(m=>[m.b,m.m,m.s==='SP'?'Special':m.s,m.sv?'Ya':'Tidak',m.st==='V'?'Terverifikasi':(m.st==='K'?'WAJIB PENAWARAN KHUSUS':'ESTIMASI / PERLU VERIFIKASI'),m.n||''].map(q).join(';')).join('\n')}

}

/* ===== actions ===== */
function startNew(){D=newDraft();D.special.pct=S.specialDefault;ui.step=1;ui.carQ='';ui.brandPick='';ui.mfilter='';ui.custErr=false;ui.showErr=false;ui.dirty=false;saveD();go('baru')}
function go(v){ui.view=v;const hs=v==='home'?'':v;if(location.hash.slice(1)!==hs){try{history.pushState(null,'',hs?'#'+hs:location.pathname+location.search)}catch(e){location.hash=hs}}render();window.scrollTo(0,0)}
function changed(){ui.dirty=true;saveD()}
function custOk(){if(Object.keys(errsCust()).length){ui.custErr=true;render();const c=document.getElementById('custCard');if(c)c.scrollIntoView({block:'start',behavior:'smooth'});toast('Isi nama customer dan nomor WhatsApp yang valid');return false}return true}
const ACT={
 go:t=>go(t.dataset.v),
 new:()=>{if(ui.view==='baru'&&ui.step===4&&(!D.id||ui.dirty)&&compute(D,S).lines.length){modal({title:'Buat perhitungan baru?',html:'<p class="mute">Penawaran ini belum disimpan. Simpan dulu agar masuk riwayat.</p>',ok:'Simpan lalu buat baru',cancel:'Buang & buat baru',onOk:()=>{needSales(()=>{saveDraftRec();toast('Tersimpan');startNew()})},onCancel:startNew});return}startNew()},
 resume:()=>{ui.step=1;ui.showErr=false;ui.dirty=true;go('baru')},
 prev:()=>{if(ui.step>1){ui.step--;ui.showErr=false;render();window.scrollTo(0,0)}else go('home')},
 next:()=>{
   if(ui.step===1&&Object.keys(errs1()).length){ui.showErr=true;render();toast(hasCar(D)||D.unreg?'Pilih warna kendaraan':'Pilih merek dan model mobil');return}
   if(ui.step===2&&!compute(D,S).lines.length){ui.showErr=true;render();toast('Pilih minimal 1 panel');return}
   if(ui.step===2){const u=Math.max(1,unitCount(D));if(D.dent.qty>u)D.dent.qty=u}
   ui.step++;ui.showErr=false;saveD();render();window.scrollTo(0,0)},
 pickCar:t=>{const m=S.models[+t.dataset.i];Object.assign(D,{brand:m.b,model:m.m,size:m.s,survey:!!m.sv||m.s==='SP',carNote:m.n||'',unreg:false,estSize:''});ui.brandPick=m.b;ui.carQ='';ui.mfilter='';
   const rc=(load(K.recent)||[]).filter(k=>k!==m.b+'|'+m.m);rc.unshift(m.b+'|'+m.m);store(K.recent,rc.slice(0,6));changed();render();window.scrollTo(0,0)},
 clearCar:()=>{const keep=D.unreg?'':D.brand;Object.assign(D,{brand:'',model:'',size:'',survey:false,carNote:'',unreg:false,estSize:'',year:''});ui.brandPick=keep;ui.carQ='';ui.mfilter='';changed();render()},
 brand:t=>{const b=t.dataset.b;if(D.brand&&D.brand!==b)Object.assign(D,{brand:'',model:'',size:'',survey:false,carNote:''});ui.brandPick=b;ui.carQ='';ui.mfilter='';render();window.scrollTo(0,0)},
 allBrands:()=>{ui.allBrands=true;render()},
 unreg:()=>{const q=ui.carQ.trim();Object.assign(D,{unreg:true,brand:ui.brandPick||'',model:ui.brandPick?q:'',size:'',survey:true,carNote:'',estSize:''});if(!ui.brandPick&&q){const w=q.split(/\s+/);const bb=Object.keys(brands()).find(b=>nk(b)===nk(w[0]));if(bb){D.brand=bb;D.model=w.slice(1).join(' ')}else D.model=q}changed();render()},
 estSize:t=>{D.estSize=D.estSize===t.dataset.k?'':t.dataset.k;changed();render()},
 mflt:t=>{ui.mflt=t.dataset.k;render()},
 verify:t=>{const m=S.models[+t.dataset.i];m.st='V';logChange('Verifikasi '+m.b+' '+m.m,'estimasi','terverifikasi');saveS();document.getElementById('mlist').innerHTML=adminModels();toast('Ditandai terverifikasi')},
 regFromQuote:t=>{const r=Q.find(q=>q.id===t.dataset.id);ui.tab='mobil';render();document.getElementById('nb').value=r.draft.brand;document.getElementById('nm').value=r.draft.model;if(r.draft.estSize)document.querySelectorAll('#nsz .chip').forEach(c=>c.classList.toggle('on',c.dataset.k===r.draft.estSize));document.getElementById('nb').scrollIntoView({block:'center'});toast('Cek kategori lalu simpan')},
 exportDb:()=>saveFile('database-mobil-rdpainthouse-'+new Date().toISOString().slice(0,10)+'.csv',dbCsv()),
 copyDb:async()=>{if(await copyText(JSON.stringify({version:S.masterVersion,models:S.models})))toast('Database (JSON) disalin')},
 resetMaster:()=>modal({title:'Kembalikan database master?',html:'<p class="mute">Daftar mobil kembali ke '+S.models.length+' → '+MASTER.length+' model sesuai file master '+esc(MASTER_VERSION)+'. Perubahan klasifikasi yang dibuat Owner akan hilang. Harga panel dan penawaran tidak berubah.</p>',ok:'Kembalikan',danger:true,onOk:()=>{S.models=masterModels();S.masterVersion=MASTER_VERSION;logChange('Database mobil dikembalikan ke master','-',MASTER_VERSION);saveS();render();toast('Database master dipulihkan')}}),
 color:t=>{D.color=t.dataset.c;changed();render()},
 inc:t=>{const p=S.panels.find(x=>x.id===t.dataset.p);const l=D.lines[p.id]||(D.lines[p.id]={qty:0,pos:[]});if(l.qty>=maxQty(p))return;
   if(p.pos&&p.pos.length){const nx=p.pos.find(x=>l.pos.indexOf(x)<0);if(nx)l.pos.push(nx);l.qty=l.pos.length}else l.qty++;changed();render()},
 dec:t=>{const l=D.lines[t.dataset.p];if(!l||!l.qty)return;if(l.pos.length){l.pos.pop();l.qty=l.pos.length}else l.qty--;if(!l.qty)delete D.lines[t.dataset.p];changed();render()},
 pos:t=>{const p=S.panels.find(x=>x.id===t.dataset.p);const l=D.lines[p.id];const ps=t.dataset.ps;const i=l.pos.indexOf(ps);if(i>=0)l.pos.splice(i,1);else l.pos.push(ps);l.pos.sort((a,b)=>p.pos.indexOf(a)-p.pos.indexOf(b));l.qty=l.pos.length;if(!l.qty)delete D.lines[p.id];changed();render()},
 addOther:()=>{D.others.push({name:'',qty:1,price:''});changed();render()},
 delOther:t=>{D.others.splice(+t.dataset.i,1);changed();render()},
 otherName:t=>{D.others[+t.dataset.i].name=t.dataset.n;changed();render()},
 opt:t=>{const k=t.dataset.k;if(k==='std'){D.std=true;D.dent.on=D.special.on=D.blend.on=D.heavy.on=false}else{D[k].on=!D[k].on;if(D[k].on)D.std=false;if(!D.dent.on&&!D.special.on&&!D.blend.on&&!D.heavy.on)D.std=true}changed();render()},
 dentNom:t=>{D.dent.nominal=+t.dataset.n;changed();render()},
 dentQ:t=>{const u=Math.max(1,unitCount(D));D.dent.qty=Math.min(u,Math.max(1,D.dent.qty+ +t.dataset.d));changed();render()},
 specPct:t=>{D.special.pct=+t.dataset.n;changed();render()},
 coat:t=>{D.coating.want=t.dataset.w==='1';if(D.coating.want&&!D.coating.pkg&&S.coating.length)D.coating.pkg=S.coating[0].id;changed();render()},
 pkg:t=>{D.coating.pkg=t.dataset.id;changed();render()},
 disc:t=>{D.disc.type=t.dataset.t;if(t.dataset.t==='pct')D.disc.pct=+t.dataset.n;changed();render()},
 wa:(t,e)=>{
   const id=t.dataset.id;const kind=t.dataset.kind;
   if(!id){ // wizard
     if(!custOk()){e.preventDefault();return}
     const n=normWa(D.wa);
     if(!salesName.trim()){e.preventDefault();needSales(()=>{render();toast('Nama tersimpan. Ketuk Kirim Penawaran WA lagi')});return}
     const res=saveDraftRec();t.href=waLink(n,buildMsg(res.rec,'est',S));
     setTimeout(()=>{render();askSent(res.rec)},400);return}
   const r=Q.find(q=>q.id===id);const n=normWa(r.draft.wa);if(!n){e.preventDefault();toast('Nomor WhatsApp customer tidak valid — perbaiki lewat Revisi');return}
   if(kind==='fin'&&!(r.approved&&FINAL_OK.indexOf(r.status)>=0)){e.preventDefault();return}
   t.href=waLink(n,buildMsg(r,kind,S));
   if(kind==='est')setTimeout(()=>askSent(r),400);else setTimeout(()=>modal({title:'Konfirmasi final sudah dikirim?',html:'<p class="mute">Jika customer setuju, ubah status ke "Customer Setuju".</p>',ok:'Tandai Customer Setuju',cancel:'Nanti',onOk:()=>{setStatus(r,'Customer Setuju');render()}}),400)},
 copy:()=>custOk()&&needSales(async()=>{const res=saveDraftRec();if(await copyText(buildMsg(res.rec,'est',S)))toast('Penawaran disalin & tersimpan ('+res.rec.no+')');render()}),
 copyRec:async t=>{const r=Q.find(q=>q.id===t.dataset.id);if(await copyText(buildMsg(r,t.dataset.kind,S)))toast('Pesan disalin')},
 saveDraft:()=>custOk()&&needSales(()=>{const res=saveDraftRec();toast(res.isNew?'Tersimpan sebagai '+res.rec.no:(res.rec.rev>1?'Tersimpan · revisi ke-'+res.rec.rev:'Sudah tersimpan'));render()}),
 askApprove:()=>custOk()&&needSales(()=>{const sv=compute(D,S).survey;const res=saveDraftRec(sv?'Menunggu Survei':'Menunggu Konfirmasi');toast((sv?'Diajukan survei ke Owner (':'Dikirim ke Owner untuk disetujui (')+res.rec.no+')');render()}),
 askApproveRec:t=>{const r=Q.find(q=>q.id===t.dataset.id);setStatus(r,'Menunggu Konfirmasi');toast('Menunggu persetujuan Owner');render()},
 finalInfo:()=>toast('Aktif setelah Owner menyetujui harga di menu Admin'),
 open:t=>{ui.detail=t.dataset.id;go('detail')},
 revise:t=>{const r=Q.find(q=>q.id===t.dataset.id);D=clone(r.draft);D.id=r.id;ui.step=2;ui.showErr=false;ui.dirty=false;saveD();go('baru')},
 approve:t=>{const r=Q.find(q=>q.id===t.dataset.id);if(r.calc.unpriced){toast('Isi harga hasil survei dulu: tekan Revisi');return}r.approved={at:Date.now()};setStatus(r,'Harga Disetujui','Owner');toast('Harga disetujui · template final aktif');render()},
 hs:t=>{ui.hs=t.dataset.s;render()},
 exportCsv:()=>exportCsv(),
 copyCsv:async()=>{if(await copyText(csv()))toast('CSV disalin')},
 delSample:()=>modal({title:'Hapus data contoh?',html:'<p class="mute">'+Q.filter(r=>r.sample).length+' penawaran contoh akan dihapus. Data asli tidak tersentuh.</p>',ok:'Hapus data contoh',danger:true,onOk:()=>{Q=Q.filter(r=>!r.sample);saveQ();toast('Data contoh dihapus');render()}}),
 unlock:()=>{const v=document.getElementById('pin').value;if(v===String(S.pin)){ui.admin=true;render()}else toast('PIN salah')},
 lock:()=>{ui.admin=false;go('home')},
 tab:t=>{ui.tab=t.dataset.t;render()},
 addPanel:()=>{S.panels.push({id:'p'+uid(),name:'Panel baru',unit:'panel baru',icon:'other',prices:{S:0,M:0,L:0,XL:0},pos:[],max:1});saveS();render();toast('Panel ditambahkan — isi nama & harga')},
 delPanel:t=>{const p=S.panels[+t.dataset.i];modal({title:'Hapus panel "'+p.name+'"?',html:'<p class="mute">Penawaran lama tidak berubah.</p>',ok:'Hapus',danger:true,onOk:()=>{S.panels.splice(+t.dataset.i,1);saveS();render()}})},
 nsz:t=>{document.querySelectorAll('#nsz .chip').forEach(c=>c.classList.toggle('on',c===t))},
 addModel:()=>{let b=document.getElementById('nb').value.trim(),m=document.getElementById('nm').value.trim();const k=(document.querySelector('#nsz .chip.on')||{}).dataset;if(!b||!m){toast('Isi merek dan model');return}
   const eb=Object.keys(brands()).find(x=>nk(x)===nk(b));if(eb)b=eb;
   if(S.models.some(x=>nk(x.b+x.m)===nk(b+m))){toast('Model sudah ada di database');return}const sz=k?k.k:'M';const sv=document.getElementById('nsv').checked||sz==='SP';
   S.models.push({b,m,s:sz,sv,n:document.getElementById('nnote').value.trim(),st:'V'});logChange('Tambah model '+b+' '+m,'-',sizeName(sz)+(sv?' + survei':''));saveS();ui.mbrand=b;ui.mq='';render();toast('Tersimpan: '+b+' '+m+' → '+sizeName(sz))},
 delModel:t=>{const m=S.models[+t.dataset.i];logChange('Hapus model '+m.b+' '+m.m,sizeName(m.s),'dihapus');S.models.splice(+t.dataset.i,1);saveS();const ml=document.getElementById('mlist');if(ml)ml.innerHTML=adminModels()},
 addCoat:()=>{S.coating.push({id:'c'+uid(),name:'',price:null,note:''});saveS();render()},
 delCoat:t=>{S.coating.splice(+t.dataset.i,1);saveS();render()},
 tplReset:t=>{S.templates[t.dataset.k]=DEFAULT_TPL[t.dataset.k];saveS();render();toast('Template dikembalikan')},
 tplPreview:t=>{const r=Q[0];if(!r){toast('Buat 1 penawaran dulu untuk contoh');return}modal({title:'Contoh pesan',html:'<textarea class="inp" style="min-height:320px" readonly>'+esc(buildMsg(r,t.dataset.k,S))+'</textarea>',cancel:'Tutup'})},
 backup:async()=>{if(await copyText(JSON.stringify({app:'rdph-mobil',at:Date.now(),settings:S,quotes:Q})))toast('Cadangan disalin — simpan di catatan/WA')},
 restore:()=>{try{const o=JSON.parse(document.getElementById('imp').value);if(!o||!Array.isArray(o.quotes)||!o.settings||!o.settings.panels)throw 0;modal({title:'Pulihkan data?',html:'<p class="mute">Data di HP ini akan diganti dengan cadangan ('+o.quotes.length+' penawaran).</p>',ok:'Pulihkan',danger:true,onOk:()=>{S=o.settings;Q=o.quotes;saveS();saveQ();toast('Data dipulihkan');render()}})}catch(e){toast('Teks cadangan tidak valid')}},
 wipeQ:()=>modal({title:'Hapus semua penawaran?',html:'<p class="mute">'+Q.length+' penawaran akan dihapus permanen dari HP ini. Ekspor CSV dulu jika perlu.</p>',ok:'Hapus semua',danger:true,onOk:()=>{Q=[];saveQ();render();toast('Semua penawaran dihapus')}}),
 resetS:()=>modal({title:'Kembalikan pengaturan awal?',html:'<p class="mute">Harga panel, model mobil, biaya tambahan, coating, template, dan PIN kembali ke awal. Riwayat penawaran tetap.</p>',ok:'Kembalikan',danger:true,onOk:()=>{S=defaultSettings();saveS();render();toast('Pengaturan awal dipulihkan')}}),
 setPin:()=>{const v=document.getElementById('np').value.trim();if(!/^\d{4,8}$/.test(v)){toast('PIN 4–8 angka');return}S.pin=v;saveS();document.getElementById('np').value='';toast('PIN diganti')}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;if(t.tagName!=='A')e.preventDefault();const f=ACT[t.dataset.act];if(f)f(t,e)});
function setPath(obj,path,val){const ks=path.split('.');let o=obj;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=val}
function fmtMoneyInput(el){const n=toNum(el.value);const pos=el.value.length-el.selectionStart;el.value=n?rp(n).replace('Rp',''):'';try{const p=Math.max(0,el.value.length-pos);el.setSelectionRange(p,p)}catch(e){}}
document.addEventListener('input',e=>{
  const t=e.target;const f=t.dataset.f;if(!f)return;
  if(t.dataset.money)fmtMoneyInput(t);
  const v=t.value;
  if(f==='salesName'){salesName=v;store(K.sales,v.trim());return}
  if(f==='carQ'){ui.carQ=v;if(v.trim())ui.brandPick='';document.getElementById('carRes').innerHTML=carResults();return}
  if(f==='mfilter'){ui.mfilter=v;document.getElementById('mres').innerHTML=brandModels();return}
  if(f.indexOf('ov.')===0){const id=f.slice(3);if(D.lines[id])D.lines[id].ov=toNum(v);changed();updateLive();return}
  if(f==='hq'){ui.hq=v;document.getElementById('hlist').innerHTML=histList(histFiltered());return}
  if(f==='pq'){ui.pq=v;document.getElementById('plist').innerHTML=modelGroups();return}
  if(f==='mq'){ui.mq=v;if(!document.getElementById('mlist'))return;document.getElementById('mlist').innerHTML=adminModels();return}
  if(f.indexOf('other.')===0){const p=f.split('.');D.others[+p[1]][p[2]]=t.dataset.money?toNum(v):v;changed();updateLive();return}
  if(f.indexOf('.')>0){setPath(D,f,t.dataset.money?toNum(v):v)}else D[f]=v;
  if(f==='wa'){const h=waHint();const el=document.getElementById('waHint');el.className='hint '+h[0];el.textContent=h[1]}
  if((f==='customer'||f==='wa')&&ui.custErr){const er=t.parentElement.querySelector('.err');if(er)er.textContent=errsCust()[f]||''}
  changed();updateLive();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.ch==='status'){const r=Q.find(q=>q.id===t.dataset.id);const s=t.value;if(s==='Harga Disetujui'&&!ui.admin){toast('Hanya Owner yang bisa menyetujui');render();return}if(s==='Harga Disetujui')r.approved={at:Date.now()};setStatus(r,s,ui.admin&&s==='Harga Disetujui'?'Owner':salesName);toast('Status: '+s);render();return}
  if(t.dataset.ch==='mbrand'){ui.mbrand=t.value;document.getElementById('mlist').innerHTML=adminModels();return}
  if(t.id==='impFile'&&t.files&&t.files[0]){if(ui.admin)importFile(t.files[0]);t.value='';return}
  if(t.dataset.ch==='official'){S.priceOfficial=t.checked;saveS();toast(t.checked?'Harga ditandai resmi':'Harga ditandai usulan');return}
  const p=t.dataset.s;if(!p||!ui.admin)return;
  let v=t.value;const ty=t.dataset.type;
  if(ty==='num')v=toNum(v);
  else if(ty==='numnull')v=toNum(v)||null;
  else if(ty==='numlist'){v=v.split(/[,;\s]+/).map(toNum).filter(Boolean);if(!v.length){toast('Isi minimal 1 angka');render();return}v=Array.from(new Set(v)).sort((a,b)=>a-b)}
  else if(ty==='list')v=v.split(',').map(x=>x.trim()).filter(Boolean);
  else if(ty==='bool')v=t.checked;
  {const ks=p.split('.');let o=S;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];const old=o[ks[ks.length-1]];
   if(/^panels\.\d+\.prices\./.test(p)&&old!==v){const pn=S.panels[+ks[1]];logChange('Harga '+pn.name+' · '+sizeName(ks[3]),rp(old),rp(v))}
   if(/^models\.\d+\.(s|sv)$/.test(p)&&old!==v){const m=S.models[+ks[1]];logChange((ks[2]==='s'?'Kategori ':'Wajib survei ')+m.b+' '+m.m,ks[2]==='s'?sizeName(old):(old?'Ya':'Tidak'),ks[2]==='s'?sizeName(v):(v?'Ya':'Tidak'));m.st='V'}}
  setPath(S,p,v);
  if(/^panels\.\d+\.name$/.test(p)){const i=+p.split('.')[1];S.panels[i].unit=String(v).toLowerCase()}
  if(/^panels\.\d+\.pos$/.test(p)){const i=+p.split('.')[1];S.panels[i].max=v.length||1}
  saveS();toast('Tersimpan');
  if(ty==='numlist'||ty==='list')render();
});
window.addEventListener('popstate',()=>{const h=location.hash.slice(1);const v=['baru','riwayat','harga','admin','detail'].indexOf(h)>=0?h:'home';if(v==='baru'&&!D){D=newDraft()}if(v==='detail'&&!ui.detail){ui.view='riwayat'}else ui.view=v;render()});
(function init(){const h=location.hash.slice(1);if(h==='baru'&&D)ui.view='baru';else if(['riwayat','harga','admin'].indexOf(h)>=0)ui.view=h;render()})();
}
</script>
